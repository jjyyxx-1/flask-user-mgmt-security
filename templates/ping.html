{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2 class="card-title">📡 Ping 网络诊断</h2>
    <form method="post" action="/ping">
        <div class="form-group" style="display:flex; gap:8px;">
            <input type="text" name="ip" class="form-input" placeholder="输入IP地址或域名..." style="flex:1; font-family: Consolas, monospace;" required>
            <button type="submit" class="btn btn-primary" style="width:auto; padding:10px 24px;">Ping</button>
        </div>
    </form>

    {% if result %}
        <div style="margin-top: 16px;">
            <p style="margin-bottom: 8px; font-weight: 600; color: #333;">执行结果：</p>
            <pre style="background: #0d1117; color: #00ff41; padding: 16px; border-radius: 8px; font-size: 13px; line-height: 1.5; overflow-x: auto; font-family: 'Consolas', 'Courier New', monospace; border: 1px solid #30363d;">{{ result | e }}</pre>
        </div>
    {% endif %}

    <div class="text-center" style="margin-top: 16px;">
        <a href="/" style="color: #667eea; font-size: 14px;">← 返回首页</a>
    </div>
</div>
{% endblock %}
